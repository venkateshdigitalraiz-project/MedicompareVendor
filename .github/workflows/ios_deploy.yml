name: iOS Deploy to App Store

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    name: Build & Upload to App Store Connect
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: |
          ls /Applications/ | grep Xcode
          echo "---"
          ls ~/Library/Developer/Xcode\ Downloads/ 2>/dev/null || echo "No downloads"

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Verify SDK version
        run: |
          xcodebuild -version
          xcodebuild -showsdks 2>/dev/null | grep iOS

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Apple Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$HOME/Library/MobileDevice/Provisioning Profiles/release.mobileprovision"

      - name: Configure Manual Signing
        run: |
          # Add ProvisioningStyle = Manual to Runner target attributes
          sed -i '' 's/97C146ED1CF9000F007C117D = {/97C146ED1CF9000F007C117D = { DevelopmentTeam = 4TQ64Q9ASA; ProvisioningStyle = Manual;/g' ios/Runner.xcodeproj/project.pbxproj

          # Add PROVISIONING_PROFILE_SPECIFIER and CODE_SIGN_STYLE to Runner target build settings
          # (Runner target doesn't have these lines, so we add them after DEVELOPMENT_TEAM)
          sed -i '' 's/DEVELOPMENT_TEAM = 4TQ64Q9ASA;/DEVELOPMENT_TEAM = 4TQ64Q9ASA; CODE_SIGN_STYLE = Manual; PROVISIONING_PROFILE_SPECIFIER = "Medicompare_vendor_profile"; CODE_SIGN_IDENTITY = "iPhone Distribution";/g' ios/Runner.xcodeproj/project.pbxproj

          # Also update RunnerTests to use manual signing
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Verify Certificate and Profile
        run: |
          echo "Checking certificates..."
          security find-identity -v -p codesigning
          echo "Checking provisioning profiles..."
          ls "$HOME/Library/MobileDevice/Provisioning Profiles/"
          echo "Checking project configuration..."
          grep -n "DEVELOPMENT_TEAM\|CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build Flutter IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_"$APP_STORE_CONNECT_API_KEY_ID".p8
          xcrun altool --upload-app --type ios --file "$(find build/ios/ipa -name '*.ipa' | head -1)" --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" --verbose

      - name: Cleanup keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/release.mobileprovision" || true
