name: MediCompare
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  file_picker: ^10.3.8
  intl: ^0.20.2
  persistent_bottom_nav_bar_v2: ^6.2.0
  line_icons: ^2.0.3
  dotted_border: ^2.1.0
  image_picker: ^1.2.1
  launcher_name: ^1.0.2
  country_picker: ^2.0.27
  go_router: ^16.3.0
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  url_launcher: ^6.3.2
  razorpay_flutter: ^1.4.1
  flutter_widget_from_html: ^0.17.1
  change_app_package_name: ^1.5.0
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/viewticket.png

icons_launcher:
  image_path: "assets/medicomparelogo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
flutter_launcher_name:
  name: "Medicompares Vendor"